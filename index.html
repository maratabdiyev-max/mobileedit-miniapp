<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>mobileedit.kz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Цвета берём из темы Telegram (светлая/тёмная); вне Telegram — светлая тема */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --field: var(--tg-theme-secondary-bg-color, #f2f2f4);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-fg: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px 16px 120px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 2px; }
  .sub { color: var(--hint); font-size: 14px; margin: 0 0 14px; }
  .sub a { color: var(--accent); text-decoration: none; }

  input { width: 100%; margin-bottom: 14px; padding: 12px; border: 0; border-radius: 10px;
    background: var(--field); color: var(--fg); font: inherit; }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .card { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 12px;
    border: 2px solid transparent; border-radius: 14px; background: var(--field); color: var(--fg);
    font: inherit; text-align: left; cursor: pointer; }
  .card.sel { border-color: var(--accent); }
  .card.sel::after { content: "✓"; position: absolute; top: 10px; right: 10px; display: grid; place-items: center;
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: 13px; }
  .logo { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px;
    color: #fff; font-size: 20px; font-weight: 700; }
  img.logo { object-fit: cover; }
  .card b { font-size: 15px; }
  .desc { color: var(--hint); font-size: 13px; line-height: 1.3; }
  .card .price { margin-top: auto; }
  .card small { color: var(--hint); font-size: 12px; }
  .price { font-size: 14px; font-weight: 600; }
  .empty { grid-column: 1 / -1; padding: 32px 0; color: var(--hint); text-align: center; }

  .combo { margin-top: 20px; padding: 14px; background: var(--field); border-radius: 14px; font-size: 15px; }
  .combo h2 { margin: 0 0 8px; font-size: 17px; }
  .combo p { display: flex; justify-content: space-between; margin: 4px 0; }
  .combo small { display: block; margin-top: 8px; color: var(--hint); font-size: 13px; }

  .bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg); box-shadow: 0 -1px 0 var(--field); }
  .bottom > div { max-width: 448px; margin: 0 auto; }
  .total { margin-bottom: 8px; font-size: 14px; color: var(--hint); }
  .total b { color: var(--fg); }
  .main { display: block; width: 100%; padding: 15px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 600; cursor: pointer; }
  .main:disabled { opacity: .35; cursor: default; }

  [hidden] { display: none !important; }

  /* Инструкция по установке */
  .howto { display: block; width: 100%; margin-bottom: 14px; padding: 12px; border: 1.5px solid var(--accent);
    border-radius: 10px; background: none; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }
  .back { width: 32px; height: 32px; margin-bottom: 12px; border: 1.5px solid var(--fg); border-radius: 8px;
    background: none; color: var(--fg); font-size: 16px; cursor: pointer; }
  .ordered { margin-bottom: 16px; padding: 14px; border-radius: 14px; background: var(--accent); color: var(--accent-fg); font-size: 15px; }
  .ordered p { margin: 0 0 6px; } .ordered p:last-child { margin: 0; }
  .step { margin-bottom: 12px; padding: 14px; border-radius: 14px; background: var(--field); font-size: 15px; }
  .step h2 { display: flex; gap: 10px; align-items: center; margin: 0 0 8px; font-size: 16px; }
  .step h2 span { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); color: var(--accent-fg); font-size: 14px; }
  .step p { margin: 0 0 8px; } .step ul { margin: 0 0 8px; padding-left: 4px; list-style: none; }
  .step > :last-child { margin-bottom: 0; }
  .warn { padding: 10px 12px; border-radius: 10px; background: rgba(217, 48, 37, .12); }
  .note { padding: 10px 12px; border-radius: 10px; background: var(--bg); }
  .shot { display: block; width: 240px; max-width: 100%; margin: 12px auto 0; border-radius: 12px; cursor: zoom-in; }
  .shot.wide { width: 100%; }
  video.shot { width: 100%; max-width: 320px; cursor: auto; }
  .zoom { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 12px; background: #000; }
  .zoom img { max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
<div class="wrap" id="catalog">
  <h1>mobileedit.kz</h1>
  <p class="sub">Подписки на iOS/Android · с 2017 года · <a href="#" id="reviews">отзывы</a></p>
  <button class="howto" id="howto">📲 Как установить</button>
  <input id="q" type="search" placeholder="Поиск приложения">
  <div class="grid" id="grid"></div>
  <div class="combo" id="combo"></div>
</div>
<div class="bottom" id="catalogBottom"><div>
  <div class="total" id="total"></div>
  <button class="main" id="order"></button>
</div></div>

<div class="wrap" id="guide" hidden>
  <button class="back" id="back" aria-label="Назад">&#9665;</button>
  <h1>Как установить программу на iPhone</h1>
  <p class="sub">Нажмите на скриншот, чтобы увеличить</p>
  <div id="ordered"></div>
  <div id="steps"></div>
</div>
<div class="bottom" id="guideBottom" hidden><div>
  <button class="main" id="write">Написать менеджеру</button>
</div></div>
<div class="zoom" id="zoom" hidden><img alt=""></div>

<script>
// Прайс (тенге), подписка на 1 год. forever — бессрочная (∞), noCombo — не входит в комбо.
// icon — файл в icons/ (иконки из App Store).
const CATALOG = [
  { name: "Persona",     icon: "persona",    price: 6000, desc: "Бьюти-камера и ретушь лица на фото и видео" },
  { name: "InShot Pro",  icon: "inshot",     price: 4690, desc: "Монтаж видео: обрезка, музыка, скорость, эффекты" },
  { name: "Reels App",   icon: "reelsapp",   price: 6000, desc: "Трендовые Reels по шаблонам, монтаж под музыку" },
  { name: "Leto",        icon: "leto",       price: 6000, desc: "500+ шрифтов и редактор для сторис и Reels" },
  { name: "SubMe",       icon: "subme",      price: 6000, desc: "Автоматические субтитры к видео" },
  { name: "500 Stories", icon: "500stories", price: 6000, desc: "800+ анимированных шаблонов сторис и Reels" },
  { name: "Mojo",        icon: "mojo",       price: 6000, desc: "1200+ шаблонов видео для Reels и TikTok" },
  { name: "Dazz Cam",    icon: "dazzcam",    price: 3690, forever: true, desc: "Ретро-камера с эффектами плёнки" },
  { name: "VSCO Plus",   icon: "vsco",       price: 5600, desc: "Фильтры и редактор фото и видео VSCO" },
  { name: "Lightroom",   icon: "lightroom",  price: 3190, desc: "Обработка фото от Adobe с ИИ-инструментами" },
  { name: "Moment",      icon: "moment",     price: 3090, forever: true, desc: "Профессиональная камера с ручными настройками" },
  { name: "FaceApp",     icon: "faceapp",    price: 6500, noCombo: true, desc: "ИИ-редактор селфи: фильтры, фоны, эффекты" },
];
// Комбо: цена за N программ
const COMBO = { 2: 10000, 3: 14000, 4: 18000, 5: 22000 };
const MANAGER = "premiumresell";        // Telegram для заказов
const REVIEWS = "https://t.me/otzyvymobileedit";

// Инструкция по установке: текст из INSTRUCTION.md, картинки в instruction/.
// html — готовая разметка шага; shots — скриншоты (wide — на всю ширину); video — ролик к шагу.
const STEPS = [
  { title: "Удалить программу", html: `
    <p>Удалите программу, за которую оплатили, и собираетесь устанавливать через нас.</p>
    <p class="warn">‼️ После того как вы установите программы через нас, обратите внимание на пункты 15–16 ‼️</p>` },
  { title: "Открыть App Store", html: `<p>Теперь приступаем к скачиванию. Идём в App Store ⬇️</p>`,
    shots: [{ src: "photo-01", alt: "Главный экран iPhone, выделен значок App Store" }] },
  { title: "Открыть профиль",
    shots: [{ src: "photo-02", alt: "App Store, вкладка Today, выделен значок профиля справа вверху" }] },
  { title: "Прокрутить вниз",
    shots: [{ src: "photo-03", alt: "Экран Account с вашим Apple ID: крутим вниз, чтобы выйти" }] },
  { title: "Нажать Sign Out",
    shots: [{ src: "photo-04", alt: "Низ экрана Account, выделена кнопка Sign Out (или «Выйти»)" }] },
  { title: "Вход в наш Apple ID", html: `
    <p>Как нажали sign out / выйти, поднимитесь снова наверх.</p>
    <p>Далее введите наши данные, которые мы вам отправили лично в WhatsApp / Telegram, и нажмите <b>sign in</b>.</p>
    <p><b>Для тех, у кого новый iOS:</b></p>
    <ul><li>✔️ Нажмите <b>sign in with Apple ID</b>.</li>
      <li>✔️ Далее выбираете <b>второй пункт</b>, не «Ваше Имя Фамилия».</li></ul>
    <p>Далее уже вводите наши данные. Они у нас с вами в чате, указали стрелками Apple ID и пароль.</p>
    <p class="warn">‼️ Прежде чем нажать на sign in, напишите нам заранее, что вы собираетесь заходить, так как мы можем быть не онлайн. Дождитесь нашего ответа, убедитесь, что мы можем вам выдать код, и только после этого заходите ‼️</p>` },
  { title: "«Не получили код проверки»", html: `<p>Нажмите «не получили код проверки».</p>`,
    shots: [{ src: "photo-06", alt: "Двухфакторная аутентификация, выделена ссылка «Не получили код проверки?»" }] },
  { title: "Отправить код на номер", html: `<p>Отправляем код на номер.</p>`,
    shots: [{ src: "photo-07", alt: "Окно «Не получили код?», выделен пункт «Отправить код на номер …24»" }] },
  { title: "Получение и ввод кода", html: `
    <p>К нам придёт код. Как отправите его нам, напишите нам слово «код». Мы вам его отправим.</p>
    <p>Введите его ниже, и вы зайдёте в наш Apple ID автоматически.</p>`,
    shots: [{ src: "photo-08", alt: "Экран ввода шестизначного кода, отправленного на номер …24" }] },
  { title: "Вы в нашем Apple ID", html: `
    <p>Вы в нашем айди.</p>
    <p class="note">‼️ Для тех, у кого новый iOS:<br>Нажмите на <b>Apps</b> и скачайте, пожалуйста, оттуда.</p>`,
    shots: [{ src: "photo-09", alt: "Экран Account под нашим Apple ID, выделен пункт Purchased (или «Покупки»)" }] },
  { title: "Открыть список покупок", html: `<p>Нажмите <b>My Purchases</b> (Мои покупки).</p>`,
    shots: [{ src: "photo-10", alt: "Экран All Purchases, выделен пункт My Purchases" }] },
  { title: "Найти и скачать программу", html: `
    <p>Ищем и скачиваем программу, за которую оплатили (возле них облако со стрелкой).</p>
    <div class="warn"><p>❕❗️ <b>Внимание</b></p>
      <p>Для каждой купленной у нас программы мы открываем доступ именно для вас.</p>
      <p>(!) Если вы скачиваете программу, для которой не покупали доступ, спустя время снимается полная оплата за программу с вашей кредитной карты. Будьте, пожалуйста, бдительнее.</p></div>`,
    shots: [{ src: "photo-11", alt: "Список покупок с полем Search, возле программ значок облака со стрелкой" }] },
  { title: "Восстановить полную версию", html: `
    <p>Как скачали программу, не выходим сразу с нашего айди.<br>
      Нужно восстановить программу на полную версию, находясь в нашем айди.</p>
    <p>Инструкции отправляются каждому лично (проверяем WhatsApp / Telegram).</p>` },
  { title: "Выход из нашего ID и возврат в свой", html: `
    <p>Как убедились, что всё открыто в программе, выходите с нашего айди и обратно в свой. Выходим с нашего айди так же, как и выходили со своего аккаунта (шаги 3–5).</p>
    <p class="warn">‼️ <b>ВАЖНО ОТКЛЮЧИТЬ ФУНКЦИИ НИЖЕ</b> ⬇️ Переустановка программ по причине не отключения ПЛАТНАЯ за полную стоимость. ‼️</p>` },
  { title: "Отключить автозагрузки", html: `
    <p>✅ После того как вы завершили установку и переключились на свой Apple ID, ВАЖНО отключить функции ниже, чтобы проходить с программами долгий срок ⬇️</p>
    <p>☑️ <b>Отключаем:</b></p>
    <ul><li>🔘 Приложения</li><li>🔘 Обновления ПО</li><li>🔘 Сгружать неиспользуемые</li></ul>
    <p>Также проверяйте данные функции, выключены ли они, после каждого обновления на новый iOS (программное обеспечение, ПО), так как они могут включиться автоматически.</p>
    <p>☑️ Если у вас нет этих кнопок, убедитесь, что вы находитесь в своём Apple ID в App Store.</p>
    <p>☑️ Если они не активны, уберите телефон с режима энергосбережения.</p>
    <p class="warn">⚠️ Обратная установка программ по причине не отключения данных функций платная.</p>`,
    video: { src: "video-step-15.mp4", poster: "video-step-15-frame-a-settings-icon.jpg" } },
  { title: "Проверка «Управления подписками»", html: `
    <p>☝️ Важное про «Управление подписками».</p>
    <p>После того как вы всё установили, вы обратно заходите в свой Apple ID. Теперь важно проверить в своём Apple ID, нет ли у вас активной подписки на ту программу/ы, которые вы только что установили через наши данные.</p>
    <p>Проверяем следующим образом, и повторяю: в своём Apple ID ⬇️</p>`,
    shots: [{ src: "photo-13", wide: true, alt: "App Store → профиль → пункт Subscriptions. Если такого пункта нет, активных подписок нет" },
            { src: "photo-14", wide: true, alt: "Раздел Subscriptions: в ACTIVE отмените подписку на программу, в EXPIRED ничего не трогаем" }] },
];

const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.platform && tg.platform !== "unknown");
if (tg) { tg.ready(); tg.expand(); }

const state = { q: "", picked: new Set() };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (n) => n.toLocaleString("ru-RU") + " ₸";
const programs = (n) => `${n} ${n >= 5 ? "программ" : "программы"}`;
const haptic = () => { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} };

function openLink(url) {
  if (inTelegram && url.startsWith("https://t.me/")) tg.openTelegramLink(url);
  else window.open(url, "_blank");
}

// Итог заказа: комбо берём, только если оно дешевле суммы; больше 5 программ — цену уточняет менеджер
function calc() {
  const apps = CATALOG.filter((a) => state.picked.has(a.name));
  const inCombo = apps.filter((a) => !a.noCombo), outside = apps.filter((a) => a.noCombo);
  const sum = (list) => list.reduce((s, a) => s + a.price, 0);
  const n = inCombo.length;
  if (n > 5) return { apps, total: null };
  const combo = COMBO[n] && COMBO[n] < sum(inCombo) ? COMBO[n] : null;
  return { apps, inCombo, outside, combo, total: (combo || sum(inCombo)) + sum(outside) };
}

function render() {
  const q = state.q.trim().toLowerCase();
  const items = CATALOG.filter((a) => a.name.toLowerCase().includes(q));
  $("grid").innerHTML = items.length ? items.map((a) => `
    <button class="card ${state.picked.has(a.name) ? "sel" : ""}" data-name="${esc(a.name)}">
      <img class="logo" src="icons/${a.icon}.jpg" alt="">
      <b>${esc(a.name)}</b>
      <span class="desc">${esc(a.desc)}</span>
      <span class="price">${money(a.price)}</span>
      <small>${[a.forever ? "∞ навсегда" : "1 год", a.noCombo && "вне комбо"].filter(Boolean).join(" · ")}</small>
    </button>`).join("") : `<div class="empty">Ничего не нашлось</div>`;
  document.querySelectorAll(".card").forEach((b) => b.onclick = () => {
    const name = b.dataset.name;
    state.picked.has(name) ? state.picked.delete(name) : state.picked.add(name);
    haptic(); render();
  });

  $("combo").innerHTML = `<h2>Комбо</h2>` +
    Object.entries(COMBO).map(([n, p]) => `<p><span>${programs(n)}</span><b>${money(p)}</b></p>`).join("") +
    `<small>Выберите несколько приложений — скидка посчитается сама. FaceApp в комбо не входит.</small>`;

  const r = calc(), order = $("order");
  order.disabled = !r.apps.length;
  order.textContent = r.apps.length ? "Заказать в Telegram" : "Выберите приложения";
  $("total").innerHTML = !r.apps.length ? "Нажмите на приложение, чтобы выбрать"
    : r.total === null ? `Выбрано: ${r.apps.length} · цену уточнит менеджер`
    : `Выбрано: ${r.apps.length} · итого <b>${money(r.total)}</b>${r.combo ? " (комбо)" : ""}`;
}

function orderText() {
  const r = calc();
  const lines = r.total === null
    ? [r.apps.map((a) => a.name).join(", ")]
    : [
        r.combo ? `${r.inCombo.map((a) => a.name).join(", ")} — комбо ${programs(r.inCombo.length)}, ${money(r.combo)}`
                : r.inCombo.map((a) => `${a.name} — ${money(a.price)}`).join("\n"),
        r.outside.map((a) => `${a.name} — ${money(a.price)}`).join("\n"),
        `Итого: ${money(r.total)}`,
      ].filter(Boolean);
  return `Здравствуйте! Хочу оформить подписки:\n${lines.join("\n")}`;
}

function renderSteps() {
  $("steps").innerHTML = STEPS.map((s, i) => `
    <section class="step">
      <h2><span>${i + 1}</span>${esc(s.title)}</h2>
      ${s.html || ""}
      ${(s.shots || []).map((p) => `<img class="shot ${p.wide ? "wide" : ""}" loading="lazy"
          src="instruction/${p.src}.jpg" alt="${esc(p.alt)}">`).join("")}
      ${s.video ? `<video class="shot" controls playsinline preload="none"
          poster="instruction/${s.video.poster}" src="instruction/${s.video.src}"></video>` : ""}
    </section>`).join("");
  document.querySelectorAll("img.shot").forEach((img) => img.onclick = () => {
    $("zoom").querySelector("img").src = img.src;
    $("zoom").hidden = false;
  });
}

// Инструкция открывается кнопкой «Как установить» или после «Заказать» — тогда с плашкой заказа и кнопкой в чат
let catalogScroll = 0;
function showGuide(withOrder) {
  catalogScroll = window.scrollY;
  const r = calc();
  $("ordered").innerHTML = withOrder ? `<div class="ordered">
      <p>Ваш заказ: <b>${esc(r.apps.map((a) => a.name).join(", "))}</b> — ${r.total === null ? "цену уточнит менеджер" : money(r.total)}</p>
      <p>Менеджер пришлёт данные для входа в чате. Ниже — как установить.</p></div>` : "";
  $("catalog").hidden = $("catalogBottom").hidden = true;
  $("guide").hidden = false;
  $("guideBottom").hidden = !withOrder;
  window.scrollTo(0, 0);
  if (tg) tg.BackButton.show();
}

function back() {
  if (!$("zoom").hidden) { $("zoom").hidden = true; return; }
  $("guide").hidden = $("guideBottom").hidden = true;
  $("catalog").hidden = $("catalogBottom").hidden = false;
  window.scrollTo(0, catalogScroll);
  if (tg) tg.BackButton.hide();
}

$("order").onclick = () => showGuide(true);
$("howto").onclick = () => showGuide(false);
$("write").onclick = () => openLink(`https://t.me/${MANAGER}?text=${encodeURIComponent(orderText())}`);
$("back").onclick = back;
$("zoom").onclick = () => { $("zoom").hidden = true; };
if (tg) tg.BackButton.onClick(back);

$("q").oninput = (e) => { state.q = e.target.value; render(); };
$("reviews").onclick = (e) => { e.preventDefault(); openLink(REVIEWS); };

renderSteps();

render();
</script>
</body>
</html>
